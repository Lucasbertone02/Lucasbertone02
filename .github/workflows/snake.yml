name: Generar animación de la viborita

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generar el SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Lucasbertone02
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#0077FF&color_dots=#0A1128,#0353A4,#0077FF,#4DA3FF,#99CCFF

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
